<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ペカり君 - パチスロ エンタメシミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #050b1f;
      color: #e2e8f0;
      touch-action: manipulation;
    }
    .digital-font {
      font-family: 'Orbitron', monospace;
    }

    /* GOGO!ランプベース */
    .gogo-lamp {
      transition: all 0.15s ease-in-out;
      background: transparent;
      box-shadow: none;
    }

    /* ==========================================
       画面全体エフェクト (REG + BIG 10種類)
       ========================================== */
    #fx-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      overflow: hidden;
      transition: opacity 0.2s ease-out;
    }
    #fx-overlay::before,
    #fx-overlay::after {
      content: '';
      position: absolute;
      inset: -75%;
      opacity: 0;
    }
    #fx-overlay[class*="fx-"] { opacity: 1; }

    /* REG : ピンク脈動 */
    #fx-overlay.fx-reg {
      background: radial-gradient(circle at 50% 45%, #ff3d9a 0%, #ff007f 35%, #880044 75%, #2a0013 100%);
      animation: fx-pulse 0.6s infinite alternate;
    }
    /* BIG 1 (200枚) : ブルーウェーブ */
    #fx-overlay.fx-t1 {
      background: radial-gradient(circle at 50% 45%, #7cb8ff 0%, #2563eb 40%, #0b2a7a 80%, #050b1f 100%);
      animation: fx-pulse 0.9s infinite alternate;
    }
    /* BIG 2 (300枚) : エメラルドブリージング */
    #fx-overlay.fx-t2 {
      background: radial-gradient(circle at 50% 45%, #9af7b5 0%, #16a34a 40%, #06421f 80%, #03140a 100%);
      animation: fx-pulse 0.7s infinite alternate;
    }
    /* BIG 3 (400枚) : サンセットちらつき */
    #fx-overlay.fx-t3 {
      background: radial-gradient(circle at 50% 45%, #ffc38a 0%, #f97316 40%, #6b2503 80%, #1c0a01 100%);
      animation: fx-flicker 0.18s steps(2) infinite;
    }
    /* BIG 4 (500枚) : クリムゾン高速心拍 */
    #fx-overlay.fx-t4 {
      background: radial-gradient(circle at 50% 45%, #ff9a9a 0%, #e11d1d 40%, #5a0505 80%, #1a0202 100%);
      animation: fx-pulse 0.35s infinite alternate;
    }
    /* BIG 5 (600枚) : バイオレット回転 */
    #fx-overlay.fx-t5 { background: #1b0a3a; }
    #fx-overlay.fx-t5::before {
      opacity: 1;
      background: conic-gradient(from 0deg at 50% 50%, #a855f7, #3b0764, #e879f9, #3b0764, #a855f7);
      animation: fx-spin 4s linear infinite;
    }
    /* BIG 6 (700枚) : サンダーストロボ */
    #fx-overlay.fx-t6 {
      background: radial-gradient(circle at 50% 45%, #fffbb0 0%, #facc15 40%, #7a5a00 85%, #201700 100%);
      animation: fx-strobe 0.22s steps(2) infinite;
    }
    /* BIG 7 (800枚) : アイスバースト高速回転 */
    #fx-overlay.fx-t7 { background: #04212e; }
    #fx-overlay.fx-t7::before {
      opacity: 1;
      background: conic-gradient(from 0deg at 50% 50%, #67e8f9, #ffffff, #0891b2, #67e8f9, #ffffff, #0e7490, #67e8f9);
      animation: fx-spin 1.8s linear infinite;
    }
    /* BIG 8 (900枚) : フレイム上昇 */
    #fx-overlay.fx-t8 {
      background: linear-gradient(0deg, #6b1500, #ff3d00, #ffb300, #ff3d00, #6b1500);
      background-size: 100% 100%;
      animation: fx-rise 0.9s linear infinite;
    }
    /* BIG 9 (1000枚) : ゴールドグランド (豪華) */
    #fx-overlay.fx-t9 {
      background: radial-gradient(circle at 50% 45%, #fff9c4 0%, #ffd700 35%, #b8860b 70%, #3d2a00 100%);
      animation: fx-pulse 0.3s infinite alternate;
    }
    #fx-overlay.fx-t9::before {
      opacity: 1;
      background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0.55) 0deg 7deg, transparent 7deg 22deg);
      animation: fx-spin 6s linear infinite;
    }
    /* BIG 10 (2000枚) : レインボーメガジャックポット (超豪華) */
    #fx-overlay.fx-t10 {
      background: #000;
      animation: rainbow-glow 0.5s infinite alternate;
    }
    #fx-overlay.fx-t10::before {
      opacity: 1;
      background: conic-gradient(from 0deg at 50% 50%, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      animation: fx-spin 2s linear infinite;
    }
    #fx-overlay.fx-t10::after {
      opacity: 1;
      background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0.5) 0deg 6deg, transparent 6deg 18deg);
      animation: fx-spin 5s linear infinite reverse;
    }

    @keyframes fx-pulse {
      0% { filter: brightness(0.85); }
      100% { filter: brightness(1.35); }
    }
    @keyframes fx-flicker {
      0% { filter: brightness(1.3); }
      100% { filter: brightness(0.6); }
    }
    @keyframes fx-strobe {
      0% { filter: brightness(1.5); }
      100% { filter: brightness(0.35); }
    }
    @keyframes fx-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes fx-rise {
      from { background-position: 0 0; }
      to { background-position: 0 -100vh; }
    }
    @keyframes rainbow-glow {
      0% { filter: hue-rotate(0deg) brightness(1.2); }
      100% { filter: hue-rotate(360deg) brightness(1.6); }
    }

    /* ==========================================
       GOGO! テキスト (点灯 + 10通りの動き)
       ========================================== */
    .gogo-text {
      color: #4d4d4d;
      transition: all 0.05s ease;
    }
    .peka .gogo-text {
      color: #ffffff;
      text-shadow: 0 0 5px #fff, 0 0 15px var(--glow), 0 0 30px var(--glow), 0 0 50px var(--glow);
    }
    .tier-9 .gogo-text {
      color: #fff8c4;
      text-shadow: 0 0 6px #fff, 0 0 20px #ffd700, 0 0 40px #ffb300, 0 0 70px #ff9900;
    }
    .tier-10 .gogo-text {
      color: #ffffff;
      text-shadow: 0 0 5px #fff, 0 0 20px #00ffff, 0 0 40px #ff00ff, 0 0 60px #ffff00;
      animation: rainbow-glow 0.6s infinite alternate;
    }

    .tier-1  #gogo-text-container { animation: gogo-pulse 0.8s ease-in-out infinite alternate; }
    .tier-2  #gogo-text-container { animation: gogo-shake 0.12s linear infinite; }
    .tier-3  #gogo-text-container { animation: gogo-flicker 0.15s steps(2) infinite; }
    .tier-4  #gogo-text-container { animation: gogo-bounce 0.4s ease-in-out infinite alternate; }
    .tier-5  #gogo-text-container { animation: gogo-swing 0.5s ease-in-out infinite alternate; }
    .tier-6  #gogo-text-container { animation: gogo-zoom 0.25s ease-in-out infinite alternate; }
    .tier-7  #gogo-text-container { animation: gogo-jitter 0.18s linear infinite; }
    .tier-8  #gogo-text-container { animation: gogo-flip 1.2s linear infinite; }
    .tier-9  #gogo-text-container { animation: gogo-gold 0.35s ease-in-out infinite alternate; }
    .tier-10 #gogo-text-container { animation: gogo-mega 0.2s linear infinite; }

    @keyframes gogo-pulse   { from { transform: scale(1); } to { transform: scale(1.12); } }
    @keyframes gogo-shake   { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes gogo-flicker { from { opacity: 1; } to { opacity: 0.35; } }
    @keyframes gogo-bounce  { from { transform: translateY(0); } to { transform: translateY(-14px); } }
    @keyframes gogo-swing   { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes gogo-zoom    { from { transform: scale(1); } to { transform: scale(1.35); } }
    @keyframes gogo-jitter  { 0% { transform: skewX(-10deg) translateX(-3px); } 50% { transform: skewX(10deg) translateX(3px); } 100% { transform: skewX(-10deg) translateX(-3px); } }
    @keyframes gogo-flip    { from { transform: perspective(400px) rotateY(0deg); } to { transform: perspective(400px) rotateY(360deg); } }
    @keyframes gogo-gold    { from { transform: scale(1.05); filter: brightness(1); } to { transform: scale(1.22); filter: brightness(1.5); } }
    @keyframes gogo-mega    { 0% { transform: scale(1.3) translate(-5px, 3px); } 25% { transform: scale(1.4) translate(5px, -3px); } 50% { transform: scale(1.3) translate(-3px, -4px); } 75% { transform: scale(1.4) translate(4px, 4px); } 100% { transform: scale(1.3) translate(-5px, 3px); } }

    /* 画面シェイク (超豪華用) */
    .shake-main { animation: shake-main 0.25s linear infinite; }
    @keyframes shake-main {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-5px, 3px); }
      50% { transform: translate(5px, -3px); }
      75% { transform: translate(-3px, -4px); }
    }

    /* ボーナス揃い（777 / 77BAR）ディスプレイ overlay */
    .align-display {
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    .align-display.show-align {
      opacity: 1;
      transform: scale(1);
    }
    .align-sub {
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.85), 0 0 12px var(--glow, #ff0055);
    }

    /* 777 BIGテキスト (ティア色 --glow に連動) */
    .text-777-big {
      display: inline-block;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ffffff, 0 0 20px var(--glow), 0 0 40px var(--glow), 0 0 60px var(--glow);
      animation: big-glow 0.6s infinite alternate;
    }
    @keyframes big-glow {
      0% { filter: brightness(1); transform: scale(1); }
      100% { filter: brightness(1.5); transform: scale(1.03); }
    }

    /* 777 GOLD (1000枚) */
    .text-777-gold {
      display: inline-block;
      color: #fff8c4;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #ffd700, 0 0 40px #ffb300, 0 0 70px #ff9900;
      animation: big-glow 0.3s infinite alternate;
    }

    /* 777 RAINBOW (2000枚) */
    .text-777-super {
      display: inline-block;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #00ffff, 0 0 40px #ff00ff, 0 0 60px #ffff00;
      animation: super-glow 0.35s infinite alternate;
    }
    @keyframes super-glow {
      0% { filter: hue-rotate(0deg) brightness(1.2); transform: scale(1); }
      100% { filter: hue-rotate(360deg) brightness(1.8); transform: scale(1.1); }
    }

    /* 77 REGテキスト */
    .text-777-reg {
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #00ffcc, 0 0 40px #00ffcc;
    }

    /* スロット実機風BAR図柄 */
    .bar-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #3f3f46 0%, #000000 50%, #18181b 100%);
      color: #ffffff;
      border: 3px solid #fbbf24;
      border-radius: 8px;
      padding: 2px 14px;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 900;
      letter-spacing: 3px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.4), 0 0 20px #00ffcc;
      text-shadow: 0 0 8px #ffffff;
      transform: translateY(-4px);
      line-height: 1;
    }

    /* ==========================================
       揃い図柄 (777 / BAR BAR BAR) リール風表示
       ========================================== */
    .reels {
      display: flex;
      gap: 8px;
      width: 100%;
      padding: 0 4px;
    }
    .reel {
      flex: 1;
      height: 128px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 14px;
      border: 3px solid #4a4a4a;
      background: linear-gradient(180deg, #cfcfcf 0%, #ffffff 22%, #ffffff 78%, #c4c4c4 100%);
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.3), inset 0 -8px 12px rgba(0,0,0,0.3), 0 0 20px var(--glow, #ffffff);
    }
    .show-align .reel { animation: reel-pop 0.35s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
    .show-align .reel:nth-child(2) { animation-delay: 0.12s; }
    .show-align .reel:nth-child(3) { animation-delay: 0.24s; }
    @keyframes reel-pop {
      from { transform: scale(0.2) rotateX(90deg); opacity: 0; }
      to   { transform: scale(1) rotateX(0deg); opacity: 1; }
    }

    /* 7図柄の画像 (7red.png / 7blue.png / 7white.png) */
    .sym-img {
      max-width: 88%;
      max-height: 88%;
      object-fit: contain;
    }
    .sym-glow-gold { filter: drop-shadow(0 0 10px #ffd700) drop-shadow(0 0 18px #ffb300); }
    .sym-glow-mega { animation: sym-mega-glow 0.6s linear infinite; }
    @keyframes sym-mega-glow {
      0%   { filter: drop-shadow(0 0 12px #ff0000) drop-shadow(0 0 20px #ff0000); }
      17%  { filter: drop-shadow(0 0 12px #ffee00) drop-shadow(0 0 20px #ffee00); }
      34%  { filter: drop-shadow(0 0 12px #00e040) drop-shadow(0 0 20px #00e040); }
      50%  { filter: drop-shadow(0 0 12px #00c8ff) drop-shadow(0 0 20px #00c8ff); }
      67%  { filter: drop-shadow(0 0 12px #3355ff) drop-shadow(0 0 20px #3355ff); }
      84%  { filter: drop-shadow(0 0 12px #ff00ff) drop-shadow(0 0 20px #ff00ff); }
      100% { filter: drop-shadow(0 0 12px #ff0000) drop-shadow(0 0 20px #ff0000); }
    }

    /* 赤7 */
    .sym-seven {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(4rem, 20vw, 6rem);
      line-height: 1;
      color: transparent;
      background: linear-gradient(180deg, #ff7a7a 0%, #e60012 45%, #8a0008 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(2px 0 0 #3a0000) drop-shadow(-2px 0 0 #3a0000) drop-shadow(0 2px 0 #3a0000) drop-shadow(0 -2px 0 #3a0000);
    }
    /* 金7 (1000枚) */
    .sym-seven.sym-seven-gold {
      background: linear-gradient(180deg, #fffbd0 0%, #ffd700 45%, #a06a00 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }
    /* 虹7 (2000枚) */
    .sym-seven.sym-seven-rainbow {
      background: linear-gradient(90deg, #ff0000, #ff9900, #ffee00, #00e040, #00c8ff, #3355ff, #d000ff, #ff0000);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: rainbow-slide 0.8s linear infinite;
    }
    /* BARプレート */
    .sym-bar {
      width: 90%;
      padding: 12px 0;
      text-align: center;
      background: linear-gradient(180deg, #5a5a5a 0%, #000000 50%, #222222 100%);
      color: #ffffff;
      border: 3px solid #fbbf24;
      border-radius: 8px;
      font-weight: 900;
      font-size: clamp(1.3rem, 6.5vw, 2.1rem);
      letter-spacing: 2px;
      line-height: 1;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.4);
      text-shadow: 0 0 6px #ffffff;
    }
    @keyframes rainbow-slide {
      from { background-position: 0 0; }
      to   { background-position: 200% 0; }
    }

    /* NEXT 表示 */
    .next-hint {
      margin-top: 10px;
      opacity: 0;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      font-size: 1.1rem;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.85), 0 0 12px var(--glow, #ffffff);
    }
    .show-align .next-hint {
      animation: next-in 0.3s 0.5s both, next-blink 0.7s 0.8s infinite alternate;
    }
    @keyframes next-in {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes next-blink {
      from { opacity: 1; }
      to   { opacity: 0.35; }
    }

    /* ==========================================
       枚数表示 (ドドーン) : 青 < 黄 < 緑 < 赤 < 虹 < 特大虹
       白フチで背景と同化しないようにする
       ========================================== */
    .payout-display { opacity: 0; pointer-events: none; }
    .payout-display.show-pay { opacity: 1; }

    .payout-num {
      --ol: 3px;
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      line-height: 1.05;
      white-space: nowrap;
      filter:
        drop-shadow(var(--ol) 0 0 #ffffff)
        drop-shadow(calc(var(--ol) * -1) 0 0 #ffffff)
        drop-shadow(0 var(--ol) 0 #ffffff)
        drop-shadow(0 calc(var(--ol) * -1) 0 #ffffff)
        drop-shadow(0 0 14px var(--pay-glow, #ffffff));
    }
    .payout-unit { font-size: 0.35em; margin-left: 0.15em; }

    .pay-l1 { color: #2f8dff; --pay-glow: #1d4ed8; --ol: 3px; font-size: clamp(2.4rem, 12vw, 3.4rem); }
    .pay-l2 { color: #ffd800; --pay-glow: #ff9900; --ol: 3px; font-size: clamp(2.6rem, 13vw, 3.8rem); }
    .pay-l3 { color: #1fe05a; --pay-glow: #059a2e; --ol: 4px; font-size: clamp(2.8rem, 14vw, 4.2rem); }
    .pay-l4 { color: #ff2b2b; --pay-glow: #ff0000; --ol: 4px; font-size: clamp(3rem, 15vw, 4.6rem); }
    .pay-l5, .pay-l6 {
      color: transparent;
      background: linear-gradient(90deg, #ff0000, #ff9900, #ffee00, #00e040, #00c8ff, #3355ff, #d000ff, #ff0000);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      --pay-glow: #ff00ff;
    }
    .pay-l5 { --ol: 5px; font-size: clamp(3.2rem, 16vw, 5rem); }
    .pay-l6 { --ol: 6px; font-size: clamp(3.4rem, 17vw, 5.6rem); }

    .show-pay .payout-num { animation: don-in 0.6s cubic-bezier(0.2, 1, 0.4, 1) both; }
    .show-pay .pay-l4 { animation: don-in 0.6s cubic-bezier(0.2, 1, 0.4, 1) both, pay-throb 0.5s 0.6s ease-in-out infinite alternate; }
    .show-pay .pay-l5 { animation: don-in 0.6s cubic-bezier(0.2, 1, 0.4, 1) both, rainbow-slide 1s linear infinite, pay-throb 0.4s 0.6s ease-in-out infinite alternate; }
    .show-pay .pay-l6 { animation: don-in 0.7s cubic-bezier(0.2, 1, 0.4, 1) both, rainbow-slide 0.5s linear infinite, pay-shake 0.1s 0.7s linear infinite; }

    @keyframes don-in {
      0%   { transform: scale(3.2); opacity: 0; }
      45%  { transform: scale(0.85); opacity: 1; }
      65%  { transform: scale(1.15); }
      80%  { transform: scale(0.97); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pay-throb {
      from { transform: scale(1); }
      to   { transform: scale(1.07); }
    }
    @keyframes pay-shake {
      0%, 100% { transform: translate(0, 0) scale(1.05); }
      25% { transform: translate(-4px, 3px) scale(1.05); }
      50% { transform: translate(4px, -3px) scale(1.05); }
      75% { transform: translate(-3px, -3px) scale(1.05); }
    }

    /* フラッシュ効果 */
    .flash-screen {
      animation: flash-animation 0.25s ease-out;
    }
    @keyframes flash-animation {
      0% { background-color: rgba(255, 255, 255, 0.9); }
      100% { background-color: transparent; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-5 select-none">

  <div id="fx-overlay"></div>
  <canvas id="fx-canvas" class="fixed inset-0 pointer-events-none" style="z-index: 40;"></canvas>
  <div id="flash-overlay" class="fixed inset-0 pointer-events-none z-50"></div>

  <main class="w-full max-w-md p-5 flex flex-col gap-5 relative z-10 overflow-hidden">

    <!-- カウンター & GOGO!ランプ表示 -->
    <div class="p-4 flex flex-col gap-4">

      <!-- カウンターセグ表示 -->
      <div class="grid grid-cols-4 gap-2 p-3 text-center">
        <div>
          <div class="text-[11px] text-slate-400 font-bold">G数</div>
          <div id="display-games" class="digital-font text-xl text-yellow-400 font-bold">0</div>
        </div>
        <div>
          <div class="text-[11px] text-slate-400 font-bold">BIG</div>
          <div id="display-big" class="digital-font text-xl text-red-500 font-bold">0</div>
        </div>
        <div>
          <div class="text-[11px] text-slate-400 font-bold">REG</div>
          <div id="display-reg" class="digital-font text-xl text-green-400 font-bold">0</div>
        </div>
        <div>
          <div class="text-[11px] text-slate-400 font-bold">合算</div>
          <div id="display-prob" class="digital-font text-xs text-cyan-400 font-bold leading-7">1/0</div>
        </div>
      </div>

      <!-- ステータス情報 -->
      <div class="flex justify-between items-center px-2 text-xs">
        <div class="text-slate-300 font-bold">差枚数: <span id="display-diff" class="digital-font font-bold text-white text-sm">0</span> 枚</div>
        <div class="text-slate-300 font-bold">確率: <span class="text-yellow-400 font-bold">1/30 (超高確率)</span></div>
      </div>

      <!-- GOGO! ランプ表示ボックス -->
      <div id="gogo-box" class="gogo-lamp w-full h-56 flex flex-col items-center justify-center relative cursor-pointer">

        <!-- GOGO! ロゴ (点灯用) -->
        <div id="gogo-text-container" class="relative z-10 text-center transition-opacity duration-200">
          <div id="gogo-text" class="gogo-text font-black text-6xl tracking-tighter italic transform -rotate-3 scale-y-110">
            GOGO!
          </div>
          <div id="gogo-subtext" class="gogo-text font-bold text-xs tracking-widest mt-1 opacity-0 transition-opacity">
            CHANCE
          </div>
        </div>

        <!-- 揃い図柄表示レイヤー (777 / BAR BAR BAR) -->
        <div id="align-display" class="align-display absolute inset-0 z-20 flex flex-col items-center justify-center">
          <div id="reels" class="reels"></div>
          <div id="next-hint" class="next-hint">NEXT ▼</div>
        </div>

        <!-- 枚数表示レイヤー -->
        <div id="payout-display" class="payout-display absolute inset-0 z-30 flex flex-col items-center justify-center">
          <div id="payout-label" class="align-sub text-xs font-bold mb-2 tracking-widest uppercase"></div>
          <div id="payout-num" class="payout-num pay-l1"><span id="payout-value">0</span><span class="payout-unit">枚</span></div>
        </div>

      </div>

    </div>

    <!-- 操作ボタン部 -->
    <div class="flex flex-col gap-3">

      <!-- メイン レバーON ボタン -->
      <button id="spin-btn" class="w-full py-6 bg-gradient-to-b from-red-500 via-red-600 to-red-800 hover:from-red-400 hover:to-red-700 active:scale-95 text-white font-black text-2xl tracking-widest rounded-2xl border-t-2 border-red-300 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
        レバーON
      </button>

      <!-- ボーナスを揃える ボタン -->
      <button id="align-btn" disabled class="w-full py-4 bg-gradient-to-b from-amber-400 to-amber-600 text-slate-900 font-black text-base tracking-wider rounded-xl shadow-md border-t border-amber-200 opacity-40 cursor-not-allowed transition-all">
        ボーナスを揃える！
      </button>

    </div>

    <!-- フッター・リセット -->
    <div class="flex justify-between items-center pt-2 border-t border-white/20 text-xs text-slate-300">
      <button id="sound-toggle-btn" aria-label="音声 ON/OFF" class="px-4 py-2 bg-white/10 border border-white/20 text-slate-100 rounded-lg font-bold hover:bg-white/20 flex items-center justify-center">
      </button>
      <button id="reset-btn" class="px-4 py-2 bg-white/10 border border-white/20 text-slate-100 rounded-lg font-bold hover:bg-white/20">
        RESET
      </button>
    </div>

  </main>

  <footer class="relative z-10 my-2 text-[11px] text-slate-400 font-bold text-center">
    &copy; ペカり君 - GOGO! SIMULATOR
  </footer>

  <script>
    // ==========================================
    // BIG 当たり種類 (10種類 / 200枚〜1000枚 + 2000枚が1つ)
    // weight: 出現しやすさ, glow: GOGO!の発光色
    // ==========================================
    const BIG_TIERS = [
      { coins: 200,  weight: 20, glow: '#3b82f6', sub: 'CHANCE' },
      { coins: 300,  weight: 17, glow: '#22c55e', sub: 'CHANCE' },
      { coins: 400,  weight: 14, glow: '#f97316', sub: 'CHANCE!' },
      { coins: 500,  weight: 12, glow: '#ef4444', sub: 'CHANCE!' },
      { coins: 600,  weight: 10, glow: '#a855f7', sub: 'BIG CHANCE!' },
      { coins: 700,  weight: 8,  glow: '#facc15', sub: 'BIG CHANCE!' },
      { coins: 800,  weight: 7,  glow: '#22d3ee', sub: 'BIG CHANCE!!' },
      { coins: 900,  weight: 5,  glow: '#ff5a1f', sub: 'SUPER CHANCE!!' },
      { coins: 1000, weight: 4,  glow: '#ffd700', sub: '★ GRAND CHANCE ★', grand: true },
      { coins: 2000, weight: 1,  glow: '#ffffff', sub: '★★ MEGA JACKPOT ★★', grand: true, mega: true }
    ];

    function pickTierIndex() {
      const total = BIG_TIERS.reduce((s, t) => s + t.weight, 0);
      let r = Math.random() * total;
      for (let i = 0; i < BIG_TIERS.length; i++) {
        r -= BIG_TIERS[i].weight;
        if (r < 0) return i;
      }
      return BIG_TIERS.length - 1;
    }

    // ゲーム状態変数
    let totalGames = 0;       // 表示用G数 (ボーナス当選でリセット)
    let cumulativeGames = 0;  // 合算確率計算用の累計G数
    let bigCount = 0;
    let regCount = 0;
    let diffCoins = 0;

    let isPekared = false;
    let isBonusAligned = false;
    let pendingBonusType = null; // 'BIG' | 'REG'
    let pendingTierIndex = -1;         // 実際の当たり (枚数・図柄はこちら)
    let pendingDisplayIndex = -1;      // GOGO!演出として見せる当たり (ペカリ中の演出・音はこちら)

    // 「実は…」演出: 低めの演出(800枚未満)が、一定確率で実は800枚だった
    const SURPRISE_RATE = 0.10;
    const SURPRISE_TIER_INDEX = BIG_TIERS.findIndex(t => t.coins === 800);
    let soundEnabled = true;
    let isCooldown = false;
    let lockInterval = null;
    let alignStage = 0; // 0: 未 / 1: 図柄表示中(NEXT待ち) / 2: 枚数表示済み

    const GOGO_BASE = 'gogo-lamp w-full h-56 flex flex-col items-center justify-center relative cursor-pointer';
    const ALIGN_BTN_DEFAULT = 'w-full py-4 bg-gradient-to-b from-amber-400 to-amber-600 text-slate-900 font-black text-base tracking-wider rounded-xl shadow-md border-t border-amber-200 opacity-40 cursor-not-allowed transition-all';

    // UI Element参照
    const mainEl = document.querySelector('main');
    const spinBtn = document.getElementById('spin-btn');
    const alignBtn = document.getElementById('align-btn');
    const gogoBox = document.getElementById('gogo-box');
    const gogoSubtext = document.getElementById('gogo-subtext');
    const gogoTextContainer = document.getElementById('gogo-text-container');
    const alignDisplay = document.getElementById('align-display');
    const reelsEl = document.getElementById('reels');
    const payoutDisplay = document.getElementById('payout-display');
    const payoutLabel = document.getElementById('payout-label');
    const payoutNum = document.getElementById('payout-num');
    const payoutValue = document.getElementById('payout-value');
    const flashOverlay = document.getElementById('flash-overlay');
    const fxOverlay = document.getElementById('fx-overlay');
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    const displayGames = document.getElementById('display-games');
    const displayBig = document.getElementById('display-big');
    const displayReg = document.getElementById('display-reg');
    const displayProb = document.getElementById('display-prob');
    const displayDiff = document.getElementById('display-diff');

    // ==========================================
    // 音声
    // ==========================================
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 効果音ファイル (事前読み込み: 再生時の遅延をなくす)
    const SOUND_FILES = { gako: 'gako.mp3', vvv: 'vvv.mp3' };
    const soundAudio = {};    // HTMLAudio (フォールバック用)
    const soundBuffers = {};  // デコード済みバッファ (連続再生でも正確)

    Object.keys(SOUND_FILES).forEach(name => {
      const a = new Audio(SOUND_FILES[name]);
      a.preload = 'auto';
      a.load();
      soundAudio[name] = a;

      try {
        fetch(SOUND_FILES[name])
          .then(r => r.arrayBuffer())
          .then(buf => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx.decodeAudioData(buf);
          })
          .then(b => { soundBuffers[name] = b; })
          .catch(() => { /* file:// などで失敗した場合は HTMLAudio で再生 */ });
      } catch (e) { /* 何もしない */ }
    });

    function playSampleOnce(name) {
      if (!soundEnabled) return;
      const buf = soundBuffers[name];
      if (buf && audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.start();
        return;
      }
      const a = soundAudio[name].cloneNode();
      a.currentTime = 0;
      a.play().catch(err => {
        console.warn(SOUND_FILES[name] + "の再生に失敗したため、プログラム合成音にフォールバックします:", err);
        playGakoSynth();
      });
    }

    /* ペカリ音 (name: 'gako' | 'vvv' を count回 gapミリ秒刻みで連続再生) */
    function playGakoSound(name = 'gako', count = 1, gap = 100) {
      if (!soundEnabled) return;
      for (let i = 0; i < count; i++) {
        if (i === 0) playSampleOnce(name);
        else setTimeout(() => playSampleOnce(name), i * gap);
      }
    }

    /* ガコッ！フォールバック用合成音 */
    function playGakoSynth() {
      initAudio();
      const now = audioCtx.currentTime;

      const bufferSize = audioCtx.sampleRate * 0.08;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 700;

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(1.0, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(170, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.22);

      oscGain.gain.setValueAtTime(1.2, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);

      noise.start(now);
      osc.start(now);
      osc.stop(now + 0.22);
    }

    /* レバー/ボタンタップ音 */
    function playClickSound() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.04);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.04);
    }

    function tone(freq, start, dur, type = 'sawtooth', vol = 0.2) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + dur);
    }

    /* ファンファーレ音: tier=null なら REG */
    function playFanfare(tier, tierIndex) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      if (!tier) {
        // REG
        [440.00, 554.37, 659.25].forEach((f, i) => tone(f, now + i * 0.12, 0.35));
        return;
      }

      if (!tier.grand) {
        // 通常BIG: ティアが上がるほど音程が上がる
        const root = 523.25 * Math.pow(2, tierIndex / 12);
        [1, 1.25, 1.5, 2].forEach((r, i) => tone(root * r, now + i * 0.12, 0.35));
        return;
      }

      // 豪華 (1000枚 / 2000枚): 0.1秒刻みの3連打 → 長い和音
      const root = 523.25;
      const hits = [1, 1.125, 1.25];
      hits.forEach((h, k) => {
        const t = now + k * 0.1;
        [1, 1.25, 1.5, 2].forEach(r => tone(root * h * r, t, 0.14, 'sawtooth', 0.16));
      });
      const finale = now + 0.35;
      [1, 1.25, 1.5, 2, 2.5].forEach(r => tone(root * 1.25 * r, finale, 1.0, 'sawtooth', 0.14));

      if (tier.mega) {
        // 2000枚: キラキラ上昇アルペジオ + もう一段の3連打
        for (let i = 0; i < 12; i++) {
          tone(1046.5 * Math.pow(2, i / 12 * 1.5), finale + i * 0.07, 0.25, 'triangle', 0.12);
        }
        [1.5, 1.6875, 1.875].forEach((h, k) => {
          const t = finale + 0.9 + k * 0.1;
          [1, 1.25, 1.5, 2].forEach(r => tone(root * h * r, t, 0.14, 'sawtooth', 0.14));
        });
        [1, 1.25, 1.5, 2, 3].forEach(r => tone(root * 2 * r, finale + 1.2, 1.4, 'sawtooth', 0.12));
      }
    }

    // ==========================================
    // 演出: フラッシュ / パーティクル / シェイク
    // ==========================================
    let flashTimer = null;
    function triggerFlash() {
      clearTimeout(flashTimer);
      flashOverlay.classList.remove('flash-screen');
      void flashOverlay.offsetWidth; // アニメーション再始動
      flashOverlay.classList.add('flash-screen');
      flashTimer = setTimeout(() => flashOverlay.classList.remove('flash-screen'), 250);
    }

    function tripleFlash() {
      triggerFlash();
      setTimeout(triggerFlash, 100);
      setTimeout(triggerFlash, 200);
    }

    function shakeMain(ms) {
      mainEl.classList.add('shake-main');
      if (ms) setTimeout(() => mainEl.classList.remove('shake-main'), ms);
    }

    // パーティクル (金貨 / 紙吹雪)
    let particles = [];
    let particleMode = null; // 'gold' | 'mega' | null
    let particleRAF = null;

    function resizeCanvas() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function makeParticle(mode, x, y, vx, vy, g) {
      return {
        x, y, vx, vy, g,
        r: 5 + Math.random() * 6,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        kind: mode === 'gold' ? 'coin' : 'confetti',
        color: mode === 'gold'
          ? (Math.random() < 0.7 ? '#ffd700' : '#fff3a0')
          : `hsl(${Math.floor(Math.random() * 360)}, 100%, 60%)`
      };
    }

    function drawParticle(p) {
      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      if (p.kind === 'coin') {
        fxCtx.scale(Math.max(0.15, Math.abs(Math.cos(p.rot))), 1);
        fxCtx.beginPath();
        fxCtx.arc(0, 0, p.r * 1.3, 0, Math.PI * 2);
        fxCtx.fillStyle = p.color;
        fxCtx.fill();
        fxCtx.lineWidth = 2;
        fxCtx.strokeStyle = '#b8860b';
        fxCtx.stroke();
      } else {
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        fxCtx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      }
      fxCtx.restore();
    }

    function tickParticles() {
      particleRAF = null;
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

      if (particleMode) {
        const n = particleMode === 'mega' ? 4 : 2;
        for (let k = 0; k < n; k++) {
          particles.push(makeParticle(
            particleMode,
            Math.random() * fxCanvas.width, -20,
            (Math.random() - 0.5) * 1.5, 2 + Math.random() * 3, 0
          ));
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        if (p.y > fxCanvas.height + 40 || p.x < -100 || p.x > fxCanvas.width + 100) {
          particles.splice(i, 1);
          continue;
        }
        drawParticle(p);
      }

      if (particleMode || particles.length) {
        particleRAF = requestAnimationFrame(tickParticles);
      }
    }

    function ensureParticleLoop() {
      if (!particleRAF) particleRAF = requestAnimationFrame(tickParticles);
    }

    function startParticles(mode) {
      particleMode = mode;
      ensureParticleLoop();
    }

    function burstParticles(mode, count) {
      const cx = fxCanvas.width / 2;
      const cy = fxCanvas.height * 0.45;
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 4 + Math.random() * 9;
        particles.push(makeParticle(mode, cx, cy, Math.cos(a) * s, Math.sin(a) * s, 0.22));
      }
      ensureParticleLoop();
    }

    function stopParticles() {
      particleMode = null;
      particles = [];
      if (particleRAF) cancelAnimationFrame(particleRAF);
      particleRAF = null;
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    }

    // ==========================================
    // ゲーム進行
    // ==========================================

    /* ペカリ発生処理 */
    function triggerPekari() {
      isPekared = true;
      isBonusAligned = false;

      // ペカリ中の演出・音は「見せかけの当たり(display)」で決める。枚数はまだ分からない
      const isBig = pendingBonusType === 'BIG';
      const tier = isBig ? BIG_TIERS[pendingDisplayIndex] : null;
      const n = pendingDisplayIndex + 1;
      // 800枚以上は vvv.mp3、それ未満は gako.mp3
      const snd = tier && tier.coins >= 800 ? 'vvv' : 'gako';

      // 表示と音を同じタイミングで実行
      gogoBox.className = `${GOGO_BASE} peka ${isBig ? 'tier-' + n : 'tier-reg'}`;
      gogoBox.style.setProperty('--glow', tier ? tier.glow : '#ff007f');
      fxOverlay.className = isBig ? `fx-t${n}` : 'fx-reg';
      gogoSubtext.textContent = tier ? tier.sub : 'CHANCE';
      gogoSubtext.style.opacity = '1';

      if (tier && tier.grand) {
        // 豪華演出: ガコッ音を0.1秒刻みで3連続 + 3連フラッシュ + パーティクル
        playGakoSound(snd, 3, 100);
        tripleFlash();
        startParticles(tier.mega ? 'mega' : 'gold');
        if (tier.mega) shakeMain();
      } else {
        playGakoSound(snd);
        triggerFlash();
      }

      // 4秒間ボタンロック
      start4SecLock();
    }

    /* ペカり直後: レバーを止めて「揃える」ボタンだけ押せるようにする */
    function start4SecLock() {
      spinBtn.disabled = true;
      spinBtn.innerText = "ボーナスを揃えてください";
      alignBtn.disabled = false;
      alignBtn.classList.remove('opacity-40', 'cursor-not-allowed');
      alignBtn.classList.add('animate-bounce', 'from-yellow-400', 'to-amber-500', 'text-black');
    }

    /* レバーON 処理 */
    function handleSpin() {
      if (isCooldown) return;

      // ボーナス揃え後に次へ進む場合
      if (isBonusAligned) {
        resetPekaState();
      }

      // ペカっている途中の誤操作防止
      if (isPekared && !isBonusAligned) {
        alert("GOGO!ランプが点灯しています！「ボーナスを揃える！」を押してください。");
        return;
      }

      playClickSound();

      totalGames++;
      cumulativeGames++;
      diffCoins -= 3; // 3枚消費

      // 1/30の超高確率で抽選
      const isHit = Math.random() < (1 / 30);

      if (isHit) {
        pendingBonusType = Math.random() < 0.6 ? 'BIG' : 'REG';
        pendingDisplayIndex = pendingBonusType === 'BIG' ? pickTierIndex() : -1;
        pendingTierIndex = pendingDisplayIndex;

        // 10%の確率で、演出は控えめなのに実は800枚だった…!
        if (pendingBonusType === 'BIG'
            && BIG_TIERS[pendingDisplayIndex].coins < 800
            && Math.random() < SURPRISE_RATE) {
          pendingTierIndex = SURPRISE_TIER_INDEX;
        }

        // ボーナス当選でG数リセット
        totalGames = 0;
        updateUI();
        triggerPekari();
      } else {
        updateUI();
      }
    }

    /* 当選枚数に応じた表示レベル (1:青 2:黄 3:緑 4:赤 5:虹 6:特大虹) */
    function payLevel(coins) {
      if (coins <= 300) return 1;
      if (coins <= 500) return 2;
      if (coins <= 700) return 3;
      if (coins <= 900) return 4;
      if (coins <= 1000) return 5;
      return 6;
    }

    /* 枚数表示の「ドドーン」音 (豪華枠は0.1秒刻みで3連続) */
    function playPayoutSound(tier, level) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;
      const hits = tier && tier.grand ? 3 : 1;

      for (let i = 0; i < hits; i++) {
        const t = now + i * 0.1;
        const vol = 0.5 + level * 0.1;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.4);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.45);

        // 打撃のアタック感
        tone(900 - i * 150, t, 0.06, 'square', 0.12);
      }

      // 高レベルはキラッと余韻を足す
      if (level >= 4) {
        [1568, 2093, 2637].forEach((f, i) => tone(f, now + 0.3 + i * 0.08, 0.3, 'triangle', 0.12));
      }
    }

    /* ボーナスを揃える！ ボタン処理: 1回目=図柄表示 / 2回目(NEXT)=枚数表示 */
    function handleAlignBonus() {
      if (!isPekared || !pendingBonusType) return;
      if (alignStage === 0) showSymbols();
      else if (alignStage === 1) showPayout();
    }

    /* 1回目: 777 または BAR BAR BAR をリール風に大きく表示 */
    function showSymbols() {
      alignStage = 1;
      initAudio(); // 音の再生準備を先に済ませる

      const tier = pendingBonusType === 'BIG' ? BIG_TIERS[pendingTierIndex] : null;

      let cell;
      if (!tier) {
        cell = '<div class="sym-bar">BAR</div>';
      } else {
        // グレード順: 赤(200〜400) < 青(500〜700) < 白(800〜2000)
        const img = pendingTierIndex <= 2 ? '7red.png' : pendingTierIndex <= 5 ? '7blue.png' : '7white.png';
        const glow = tier.mega ? 'sym-glow-mega' : tier.grand ? 'sym-glow-gold' : '';
        // 画像が無い場合は文字の7で代用
        cell = `<img class="sym-img ${glow}" src="${img}" alt="7" onerror="this.outerHTML='<div class=&quot;sym-seven&quot;>7</div>'">`;
      }
      reelsEl.innerHTML = `<div class="reel">${cell}</div>`.repeat(3);

      alignDisplay.classList.add('show-align');
      gogoTextContainer.classList.add('opacity-0');

      // 揃った瞬間にファンファーレ
      playFanfare(tier, pendingTierIndex);
      triggerFlash();

      // ボタンを NEXT に切替 (もう一度押すと枚数表示)
      alignBtn.textContent = 'NEXT';
    }

    /* 2回目(NEXT): 獲得枚数をドドーンと派手に表示 */
    function showPayout() {
      alignStage = 2;
      isBonusAligned = true;
      initAudio();

      const tier = pendingBonusType === 'BIG' ? BIG_TIERS[pendingTierIndex] : null;
      let coins, label;

      if (tier) {
        bigCount++;
        coins = tier.coins;
        label = 'BIG BONUS';
        if (tier.mega) label = '🌈 MEGA BIG BONUS 🌈';
        else if (tier.grand) label = '✨ GRAND BIG BONUS ✨';
      } else {
        regCount++;
        coins = 104;
        label = 'REG BONUS';
      }
      diffCoins += coins;

      const level = payLevel(coins);
      payoutLabel.textContent = label;
      payoutValue.textContent = coins;
      payoutNum.className = `payout-num pay-l${level}`;

      // 図柄を消して枚数を表示 (アニメーションを最初から再生)
      alignDisplay.classList.remove('show-align');
      payoutDisplay.classList.remove('show-pay');
      void payoutDisplay.offsetWidth;
      payoutDisplay.classList.add('show-pay');

      playPayoutSound(tier, level);

      // 豪華演出: 3連フラッシュ + 紙吹雪/金貨の大放出 + シェイク
      if (tier && tier.grand) {
        tripleFlash();
        burstParticles(tier.mega ? 'mega' : 'gold', tier.mega ? 160 : 90);
        if (tier.mega) shakeMain(); else shakeMain(800);
      } else {
        triggerFlash();
      }

      // NEXTボタンを無効化し、レバーを「次へ」に
      alignBtn.disabled = true;
      alignBtn.className = ALIGN_BTN_DEFAULT;

      spinBtn.disabled = false;
      spinBtn.innerText = "次へ (レバーON)";

      updateUI();
    }

    /* ランプ状態をリセットして通常状態に戻す */
    function resetPekaState() {
      isPekared = false;
      isBonusAligned = false;
      pendingBonusType = null;
      pendingTierIndex = -1;
      pendingDisplayIndex = -1;

      // ロック中にリセットされた場合の後始末
      clearInterval(lockInterval);
      lockInterval = null;
      isCooldown = false;
      spinBtn.disabled = false;
      alignBtn.disabled = true;
      alignBtn.className = ALIGN_BTN_DEFAULT;
      alignBtn.textContent = 'ボーナスを揃える！';
      alignStage = 0;

      gogoBox.className = GOGO_BASE;
      fxOverlay.className = '';
      gogoSubtext.style.opacity = '0';
      gogoSubtext.textContent = 'CHANCE';

      alignDisplay.classList.remove('show-align');
      payoutDisplay.classList.remove('show-pay');
      gogoTextContainer.classList.remove('opacity-0');

      stopParticles();
      mainEl.classList.remove('shake-main');

      spinBtn.innerText = "レバーON";
    }

    /* UIデータ更新 */
    function updateUI() {
      displayGames.textContent = totalGames;
      displayBig.textContent = bigCount;
      displayReg.textContent = regCount;

      const totalBonus = bigCount + regCount;
      displayProb.textContent = totalBonus > 0 ? `1/${(cumulativeGames / totalBonus).toFixed(1)}` : `1/0`;

      displayDiff.textContent = (diffCoins >= 0 ? `+${diffCoins}` : `${diffCoins}`);
      displayDiff.className = `digital-font font-bold text-sm ${diffCoins >= 0 ? 'text-green-400' : 'text-red-400'}`;
    }

    /* データリセット */
    function resetData() {
      if (confirm("ゲームデータをリセットしますか？")) {
        totalGames = 0;
        cumulativeGames = 0;
        bigCount = 0;
        regCount = 0;
        diffCoins = 0;
        resetPekaState();
        updateUI();
      }
    }

    // イベントリスナー
    spinBtn.addEventListener('click', handleSpin);
    alignBtn.addEventListener('click', handleAlignBonus);
    document.getElementById('reset-btn').addEventListener('click', resetData);

    // 音声ON/OFF (アイコン表示)
    const ICON_SOUND_ON = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>`;
    const ICON_SOUND_OFF = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

    const soundToggleBtn = document.getElementById('sound-toggle-btn');
    soundToggleBtn.innerHTML = ICON_SOUND_ON;
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggleBtn.innerHTML = soundEnabled ? ICON_SOUND_ON : ICON_SOUND_OFF;
    });
  </script>
</body>
</html>
