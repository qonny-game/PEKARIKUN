<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ペカり君 [DEBUG]</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-5 select-none">

  <div id="fx-overlay"></div>
  <canvas id="fx-canvas" class="fixed inset-0 pointer-events-none" style="z-index: 40;"></canvas>
  <div id="flash-overlay" class="fixed inset-0 pointer-events-none z-50"></div>
  <div id="freeze-overlay"><div id="crt-line"></div><div id="crt-dot"></div></div>

  <main class="w-full max-w-md p-5 flex flex-col gap-5 relative z-10 overflow-hidden">

    <!-- カウンター & GOGO!ランプ表示 -->
    <div class="p-4 flex flex-col gap-4">

      <!-- カウンターセグ表示 -->
      <div class="grid grid-cols-4 gap-2 p-3 text-center">
        <div>
          <div class="text-[11px] text-slate-400 font-bold">G数</div>
          <div id="display-games" class="digital-font text-xl text-yellow-400 font-bold">0</div>
        </div>
        <div>
          <div class="text-[11px] text-slate-400 font-bold">BIG</div>
          <div id="display-big" class="digital-font text-xl text-red-500 font-bold">0</div>
        </div>
        <div>
          <div class="text-[11px] text-slate-400 font-bold">REG</div>
          <div id="display-reg" class="digital-font text-xl text-green-400 font-bold">0</div>
        </div>
        <div>
          <div class="text-[11px] text-slate-400 font-bold">合算</div>
          <div id="display-prob" class="digital-font text-xs text-cyan-400 font-bold leading-7">1/0</div>
        </div>
      </div>

      <!-- ステータス情報 -->
      <div class="flex justify-between items-center px-2 text-xs">
        <div class="text-slate-300 font-bold">差枚数: <span id="display-diff" class="digital-font font-bold text-white text-sm">0</span> 枚</div>
        <div class="text-slate-300 font-bold">確率: <span class="text-yellow-400 font-bold">1/30 (超高確率)</span></div>
      </div>

      <!-- GOGO! ランプ表示ボックス -->
      <div id="gogo-box" class="gogo-lamp w-full h-56 flex flex-col items-center justify-center relative cursor-pointer">

        <!-- GOGO! ロゴ (点灯用) -->
        <div id="gogo-text-container" class="relative z-10 text-center transition-opacity duration-200">
          <div id="gogo-text" class="gogo-text font-black text-6xl tracking-tighter italic transform -rotate-3 scale-y-110">
            GOGO!
          </div>
          <div id="gogo-subtext" class="gogo-text font-bold text-xs tracking-widest mt-1 opacity-0 transition-opacity">
            CHANCE
          </div>
        </div>

        <!-- 揃い図柄表示レイヤー (777 / BAR BAR BAR) -->
        <div id="align-display" class="align-display absolute inset-0 z-20 flex flex-col items-center justify-center">
          <div id="reels" class="reels"></div>
          <div id="next-hint" class="next-hint">NEXT ▼</div>
        </div>

        <!-- 枚数表示レイヤー -->
        <div id="payout-display" class="payout-display absolute inset-0 z-30 flex flex-col items-center justify-center">
          <div id="payout-label" class="align-sub text-xs font-bold mb-2 tracking-widest uppercase"></div>
          <div id="payout-num" class="payout-num pay-l1"><span id="payout-value">0</span><span class="payout-unit">枚</span></div>
        </div>

      </div>

    </div>

    <!-- 操作ボタン部 -->
    <div class="flex flex-col gap-3">

      <!-- デバッグ: 全演出テスト (不要になったらこのブロックを削除) -->
      <details id="debug-panel" open class="rounded-xl border border-white/20 bg-white/5 text-xs">
        <summary class="cursor-pointer px-3 py-2 font-bold text-slate-300">🛠 DEBUG (全演出テスト)</summary>
        <div class="p-2 flex flex-col gap-2">
          <div class="text-[11px] text-slate-400 font-bold">BIG (演出 = 枚数)</div>
          <div id="debug-big" class="grid grid-cols-5 gap-1"></div>
          <div class="text-[11px] text-slate-400 font-bold">REG / 特殊演出</div>
          <div id="debug-special" class="grid grid-cols-2 sm:grid-cols-4 gap-1"></div>
        </div>
      </details>

      <!-- メイン レバーON ボタン -->
      <button id="spin-btn" class="w-full py-6 bg-gradient-to-b from-red-500 via-red-600 to-red-800 hover:from-red-400 hover:to-red-700 active:scale-95 text-white font-black text-2xl tracking-widest rounded-2xl border-t-2 border-red-300 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
        レバーON
      </button>

      <!-- ボーナスを揃える ボタン -->
      <button id="align-btn" disabled class="w-full py-4 bg-gradient-to-b from-amber-400 to-amber-600 text-slate-900 font-black text-base tracking-wider rounded-xl shadow-md border-t border-amber-200 opacity-40 cursor-not-allowed transition-all">
        ボーナスを揃える！
      </button>

    </div>

    <!-- フッター・リセット -->
    <div class="flex justify-between items-center pt-2 border-t border-white/20 text-xs text-slate-300">
      <button id="sound-toggle-btn" aria-label="音声 ON/OFF" class="px-4 py-2 bg-white/10 border border-white/20 text-slate-100 rounded-lg font-bold hover:bg-white/20 flex items-center justify-center">
      </button>
      <button id="reset-btn" class="px-4 py-2 bg-white/10 border border-white/20 text-slate-100 rounded-lg font-bold hover:bg-white/20">
        RESET
      </button>
    </div>

  </main>

  <footer class="relative z-10 my-2 text-[11px] text-slate-400 font-bold text-center">
    &copy; ペカり君 - GOGO! SIMULATOR
  </footer>

  <script src="app.js"></script>
  <script>
    // ==========================================
    // デバッグ: 全演出をボタンで再生 (G数・回数・差枚数は変化しない)
    // ==========================================
    function debugStart({ type, display = -1, actual = -1, freeze = -1 }) {
      if (isFreezing) return; // 暗転中は無視
      resetPekaState();       // 進行中の状態を初期化
      isDebugRun = true;

      pendingBonusType = type;
      pendingDisplayIndex = type === 'BIG' ? display : -1;
      pendingTierIndex = type === 'BIG' ? actual : -1;
      pendingFreezeIndex = freeze;

      initAudio();
      triggerPekari();
    }

    (function buildDebugPanel() {
      const btnClass = 'px-1 py-2 rounded-lg bg-white/10 border border-white/20 text-slate-100 font-bold hover:bg-white/20 active:scale-95 transition-all';
      const bigWrap = document.getElementById('debug-big');
      const specialWrap = document.getElementById('debug-special');

      const add = (wrap, label, opts) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = btnClass;
        b.textContent = label;
        b.addEventListener('click', () => debugStart(opts));
        wrap.appendChild(b);
      };

      BIG_TIERS.forEach((t, i) => add(bigWrap, t.coins, { type: 'BIG', display: i, actual: i }));

      const idx = c => BIG_TIERS.findIndex(t => t.coins === c);
      add(specialWrap, 'REG', { type: 'REG' });
      add(specialWrap, '200→実は800', { type: 'BIG', display: idx(200), actual: idx(800) });
      add(specialWrap, 'フリーズ→1000', { type: 'BIG', display: idx(200), actual: idx(200), freeze: idx(1000) });
      add(specialWrap, 'フリーズ→2000', { type: 'BIG', display: idx(200), actual: idx(200), freeze: idx(2000) });
    })();
  </script>
</body>
</html>
